extends: ["spectral:oas"]

rules:
  operation-operationId: error

  no-response-body-on-204:
    description: "HTTP 204 No Content must not declare a message body."
    message: "204 response must not have a content field defined."
    severity: error
    given: "$.paths.*.*.responses['204']"
    then:
      field: content
      function: falsy

  response-200-schema-must-have-properties:
    description: "Response 200 schema must define at least one property."
    message: "Schema for 200 response must have defined properties."
    severity: error
    given: "$.paths.*.*.responses['200'].content['application/json'].schema"
    resolved: true
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - type: object
              required: [properties]
              properties:
                properties:
                  type: object
                  minProperties: 1
            - type: object
              required: [items]
              properties:
                items:
                  type: object

  info-contact: off
  operation-description: off
  operation-tags: off
